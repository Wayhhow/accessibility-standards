<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>橙光队无障碍督导标准查询</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Skip to content link for accessibility -->
  <a href="#main-content" class="skip-link">跳转到主要内容</a>

  <!-- Header -->
  <header class="site-header" role="banner">
    <div class="container">
      <div class="header-inner">
        <div class="logo" aria-label="橙光队无障碍督导标准查询">
          <img src="image/logo.png" alt="橙光队队徽" class="logo-icon" width="32" height="32">
          <h1 class="site-title">橙光队无障碍督导标准查询</h1>
        </div>
        <div class="search-box" role="search" aria-label="搜索标准条文">
          <label for="search-input" class="sr-only">搜索标准条文</label>
          <div class="search-input-wrapper">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="search" id="search-input" class="search-input" placeholder="输入关键词搜索条文..." autocomplete="off" aria-describedby="search-hint">
          </div>
          <button id="search-btn" class="btn btn-primary search-btn" type="button" aria-label="搜索">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <span>搜索</span>
          </button>
        </div>
      </div>
      <span id="search-hint" class="sr-only">输入关键词后自动搜索，如"盲道"、"坡道"、"1:12"等</span>
    </div>
  </header>

  <!-- Search Results (hidden by default) -->
  <section id="search-results-section" class="search-results-section" role="region" aria-label="搜索结果" aria-live="polite" style="display:none;">
    <div class="container">
      <div class="search-results-header">
        <h2 id="search-results-title" class="search-results-title">搜索结果</h2>
        <button id="clear-search-btn" class="btn btn-outline btn-sm" type="button" aria-label="清除搜索">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          <span>清除搜索</span>
        </button>
      </div>
      <div id="search-results" class="search-results" aria-describedby="search-results-title"></div>
    </div>
  </section>

  <!-- Main Content -->
  <main id="main-content" class="main-content" role="main">
    <div class="container">

      <!-- Common Issues Section -->
      <section id="common-issues-section" class="common-issues-section" role="region" aria-label="常见问题">
        <h2 class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
          常见问题速查
        </h2>
        <div class="issue-categories" role="tablist" aria-label="问题分类">
          <button class="category-tab active" role="tab" aria-selected="true" data-category="all">全部</button>
          <button class="category-tab" role="tab" aria-selected="false" data-category="盲道">盲道</button>
          <button class="category-tab" role="tab" aria-selected="false" data-category="坡道">坡道</button>
          <button class="category-tab" role="tab" aria-selected="false" data-category="缘石坡道">缘石坡道</button>
          <button class="category-tab" role="tab" aria-selected="false" data-category="出入口">出入口</button>
          <button class="category-tab" role="tab" aria-selected="false" data-category="卫生间">卫生间</button>
          <button class="category-tab" role="tab" aria-selected="false" data-category="其他">其他</button>
        </div>
        <div id="common-issues-list" class="common-issues-list" role="tabpanel"></div>
      </section>

      <!-- Standards Outline Section -->
      <section id="outline-section" class="outline-section" role="region" aria-label="标准大纲">
        <h2 class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          标准条文大纲
        </h2>
        <nav class="standard-tabs" role="tablist" aria-label="标准选择">
          <!-- Tabs will be generated by JS -->
        </nav>
        <div id="outline-tree" class="outline-tree" role="tree" aria-label="标准条文目录">
          <!-- Outline will be generated by JS -->
        </div>
      </section>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <div class="footer-content">
        <p class="footer-desc">橙光队无障碍督导标准查询 -- 依据国家标准 GB 55019-2021、GB 50763-2012 等</p>
        <div class="footer-links">
          <a href="https://wayhhow.github.io/survey-map/" target="_blank" rel="noopener noreferrer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            督导路线地图
          </a>
          <a href="https://github.com/Wayhhow" target="_blank" rel="noopener noreferrer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
            GitHub
          </a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/common-issues.js"></script>
  <script src="js/search.js"></script>
  <script src="js/outline.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
